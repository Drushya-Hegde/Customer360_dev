services:
  api:
    build: ./apps/api
    environment:
      PORT: 4100
      FRONTEND_ORIGIN: http://localhost:4200
      DATABASE_URL: postgresql://customer360:customer360_dev@postgres:5432/customer360
    ports:
      - "4100:4100"
    depends_on:
      - postgres

  web:
    build: ./apps/web
    ports:
      - "4200:80"
    depends_on:
      - api

  demo-app:
    build: .
    environment:
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/customer360/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: customer360-web
    ports:
      - "4000:4000"
    depends_on:
      - keycloak

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: customer360
      POSTGRES_USER: customer360
      POSTGRES_PASSWORD: customer360_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/customer360-realm.json:/opt/keycloak/data/import/customer360-realm.json:ro

volumes:
  postgres_data:
  keycloak_data:

