apiVersion: v1
kind: Namespace
metadata:
  name: customer360
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer360-config
  namespace: customer360
data:
  OLLAMA_MODEL: qwen2.5:3b
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-api
  namespace: customer360
spec:
  replicas: 2
  selector:
    matchLabels: { app: nest-api }
  template:
    metadata:
      labels: { app: nest-api }
    spec:
      containers:
        - name: nest-api
          image: your-registry/customer360-nest-api:latest
          ports: [{ containerPort: 4100 }]
          envFrom:
            - configMapRef: { name: customer360-config }
            - secretRef: { name: customer360-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 4100 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nest-api
  namespace: customer360
spec:
  selector: { app: nest-api }
  ports: [{ port: 4100, targetPort: 4100 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-frontend
  namespace: customer360
spec:
  replicas: 2
  selector:
    matchLabels: { app: angular-frontend }
  template:
    metadata:
      labels: { app: angular-frontend }
    spec:
      containers:
        - name: angular-frontend
          image: your-registry/customer360-angular:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: angular-frontend
  namespace: customer360
spec:
  type: LoadBalancer
  selector: { app: angular-frontend }
  ports: [{ port: 80, targetPort: 80 }]
